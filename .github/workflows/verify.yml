name: Verify package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
        python-version:
          - "3.9"
          - "3.12"

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify package (Python)
        run: python scripts/verify_package.py

      - name: Run contract tests
        run: python -B -m unittest discover -s tests -p "test_*.py"

      - name: Verify package (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\verify-package.ps1

      - name: Verify package (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\verify-package.ps1
